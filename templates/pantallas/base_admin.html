{% load static %}
<!doctype html>
<html lang="es">
<head>

    <title>
        {% block titulo %}
        {% endblock %}
    </title>
    <link rel="stylesheet" href="{% static "css/style.css" %}">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-0evHe/X+R7YkIZDRvuzKMRqM+OrBnVFBL6DOitfPri4tjfHxaWutUpFmBp4vmVor" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="icon" href="{% static 'imagenes/apocosi.jpg' %}" type="image/jpg">

</head>

<body>

<div>
    <nav class="sidebar close">
        <div class="menu-bar">
            <div class="menu">

                <ul class="menu-links2">

                    <li class="nav-link" style="background-color: #125680; border-radius: 10px">
                        <i class="bx bx-user-circle icon" style="color: white"></i>
                        <span class="text nav-text" style="color: white">{{ user.username }}</span>
                    </li>
                    <br><br>
                    <li class="nav-link">
                        <a href="{% url 'mapeo:administracion-inicio' %}" class="nav__link">
                            <i class="bx bx-home-alt icon"></i>
                            <span class="text nav-text">Inicio</span>
                        </a>
                    </li>

                        <li class="nav-link">
                            <a href="{% url 'mapeo:facultad' %}" class="nav__link">
                                <i class="bx bx-building icon"></i>
                                <span class="text nav-text">Facultades</span>
                            </a>
                        </li>

                    <li class="nav-link">
                        <a href="{% url 'mapeo:bloque' %}" class="nav__link">
                            <i class="bx bx-buildings icon"></i>
                            <span class="text nav-text">Bloques</span>
                        </a>
                    </li>

                    <li class="nav-link">
                        <a href="{% url 'mapeo:nodo' %}" class="nav__link">
                            <i class="bx bx-circle icon"></i>
                            <span class="text nav-text">Nodos</span>
                        </a>
                    </li>

                    <li class="nav-link">
                        <a href="{% url 'mapeo:grafo' %}" class="nav__link">
                            <i class="bx bx-shape-circle icon"></i>
                            <span class="text nav-text">Grafo</span>
                        </a>
                    </li>

                    {% if request.user.is_superuser %}
                        <li class="nav-link">
                            <a href="{% url 'mapeo:admin' %}" class="nav__link">
                                <i class="bx bx-user icon"></i>
                                <span class="text nav-text">Administradores</span>
                            </a>
                        </li>
                    {% endif %}


                </ul>
            </div>
            <div class="bottom-content">
                <li class="">
                    <a href="{% url 'mapeo:cerrar_sesion' %}">
                        <i class="bx bx-log-out icon"></i>
                        <span class="text nav-text">Cerrar Sesión</span>
                    </a>
                </li>
            </div>
        </div>
    </nav>
</div>

<section class="home">
    <div class="text">
        {% block contenido %}

        {% endblock %}
    </div>
</section>
<script src="{% static 'scripts/scripts.js' %}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous"></script>
</body>
</html>
