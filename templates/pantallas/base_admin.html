{% load static %}
<!doctype html>
<html lang="es">
  <head>


    <title>
      {% block titulo %}
      {% endblock %}
    </title>
        <link rel="stylesheet" href="{% static "css/style.css" %}" >
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-0evHe/X+R7YkIZDRvuzKMRqM+OrBnVFBL6DOitfPri4tjfHxaWutUpFmBp4vmVor" crossorigin="anonymous">

  </head>

  <body>

    <div class="barraPrincipal" style="height: 60px">
        <h1 align="center" id="texto_barra">Administración
                <a href="{% url 'login' %}" class="btn btn-danger" tabindex="-1" role="button" aria-disabled="true">Cerrar sesión</a>
        </h1>

    </div>

    <div class="div_principal">
        <nav class="nav">
        <ul class="list">

            <li class="list__item list__item--inside">
                <div class="list__button">
                    <a href="{% url 'inicio' %}" class="nav__link">Buscar</a>
                </div>
            </li>

            <li class="list__item list__item--inside">
                <div class="list__button">
                    <a href="#" class="nav__link">Inicio</a>
                </div>
            </li>

            <li class="list__item list__item--inside">
                <div class="list__button">
                    <a href="#" class="nav__link">Bloques</a>
                </div>
            </li>

            <li class="list__item list__item--inside">
                <div class="list__button">
                    <a href="#" class="nav__link">Nodos</a>
                </div>
            </li>

            {% if user.is_superuser != False %}
                <li class="list__item list__item--inside">
                <div class="list__button">
                    <a href="#" class="nav__link">Cuentas</a>
                </div>
            </li>
            {% endif %}


        </ul>
    </nav>
        {% block contenido %}

        {% endblock %}
    </div>

  </body>
</html>
