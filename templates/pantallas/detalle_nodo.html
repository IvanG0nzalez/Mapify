{% extends 'pantallas/base_admin.html' %}
{% load static %}

{% block titulo %}
    Detalle de Nodo
{% endblock %}


{% block contenido %}
    <h1 class="container">Detalle de Nodo</h1>
    <div id="div_center">
        <div class="div_responsive">
            <form>
                <div class="mb-4">
                    <li>
                        <label for="bloque" class="form-label"><strong>Bloque:</strong> {{ nodo.bloque }}</label>
                    </li>
                </div>
                <div class="mb-4">
                    <li>
                        <label for="codigo" class="form-label"><strong>Código:</strong> {{ nodo.codigo }}</label>
                    </li>
                </div>
                <div class="mb-4">
                    <li>
                        <label for="latitud" class="form-label"><strong>Latitud:</strong> {{ nodo.latitud }}</label>
                    </li>
                </div>
                <div class="mb-4">
                    <li>
                        <label for="altitud" class="form-label"><strong>Altitud:</strong> {{ nodo.altitud }}</label>
                    </li>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="{% url 'mapeo:nodo' %}" class="btn btn-primary mx-2">Volver</a>
                    <a href="{% url 'mapeo:conexion-nodo' nodo_id=nodo.id %}" class="btn btn-dark">Conexiones</a>
                </div>

            </form>
        </div>
    </div>


{% endblock %}
