{% extends 'pantallas/base_admin.html' %}
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>
        {% block titulo %}
            Informacion del Nodo
        {% endblock %}
    </title>
    <link rel="stylesheet" href="{% static "css/style.css" %}" alt="usuario"
          style="padding-bottom: 35px; margin-top: 30px" width=20%>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-0evHe/X+R7YkIZDRvuzKMRqM+OrBnVFBL6DOitfPri4tjfHxaWutUpFmBp4vmVor" crossorigin="anonymous">

</head>

{% block contenido %}
    <h1 class="container">Detalle Nodo</h1>
    <div  id="infNodo">
        <form>
            <div class="mb-4">
                <li>
                    <label for="bloque" class="form-label"><strong>Bloque:</strong> {{ nodo.bloque }}</label>
                </li>
            </div>
            <div class="mb-4">
                <li>
                    <label for="codigo" class="form-label"><strong>Código:</strong> {{ nodo.codigo }}</label>
                </li>
            </div>
            <div class="mb-4">
                <li>
                    <label for="latitud" class="form-label"><strong>Latitud:</strong> {{ nodo.latitud }}</label>
                </li>
            </div>
            <div class="mb-4">
                <li>
                    <label for="altitud" class="form-label"><strong>Altitud:</strong> {{ nodo.altitud }}</label>
                </li>
            </div>

            <div class="d-flex justify-content-between">
                <a href="{% url 'mapeo:conexion-nodo' nodo_id=nodo.id %}" class="btn btn-primary">Conexión</a>
            </div>

        </form>
    </div>

    <script src="{% static "scripts/scripts.js" %}"></script>
{% endblock %}

</html>
