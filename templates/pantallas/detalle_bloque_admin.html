{% extends 'pantallas/base_admin.html' %}
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>
        {% block titulo %}
            Detalle Bloque
        {% endblock %}
    </title>
    <link rel="stylesheet" href="{% static "css/style.css" %}" alt="usuario"
          style="padding-bottom: 35px; margin-top: 30px" width=20%>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-0evHe/X+R7YkIZDRvuzKMRqM+OrBnVFBL6DOitfPri4tjfHxaWutUpFmBp4vmVor" crossorigin="anonymous">

</head>

{% block contenido %}
    <h1 class="container">Detalle Bloque</h1>

    <div class="container mt-5">
        <form>
            <div class="mb-3">
                <label for="zona" class="form-label">Zona:</label>
                <input type="text" class="form-control" id="zona" name="zona" placeholder="Ingresar zona">
            </div>
            <div class="mb-3">
                <label for="codigo" class="form-label">Código:</label>
                <input type="text" class="form-control" id="codigo" name="codigo" placeholder="Ingresar codigo">
            </div>
            <div class="mb-3">
                <label for="descripcion" class="form-label">Descripción:</label>
                <textarea class="form-control" id="descripcion" name="descripcion" rows="3"
                          placeholder="Descripción del bloque"></textarea>
            </div>
            <div class="mb-3">
                <label for="facultad" class="form-label">Facultad:</label>
                <input type="text" class="form-control" id="facultad" name="facultad" placeholder="Ingresar facultad">
            </div>

            <div class="d-flex justify-content-between">
                <a href="{% url 'bloque' %}" class="btn btn-primary">Conexión</a>

                <div>

                    <a href="{% url 'modificar-bloque' %}" class="btn btn-warning mx-2">Modificar</a>
                    <a href="{% url 'bloque' %}" class="btn btn-danger mx-2">Eliminar</a>

                </div>
            </div>


        </form>
    </div>

    <script src="{% static "scripts/scripts.js" %}"></script>
{% endblock %}

</html>
