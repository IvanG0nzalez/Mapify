{% load static %}
<!doctype html>
<html lang="es">
<head>

    {#style="padding-bottom: 35px; margin-top: 30px" width=20%#}
    <title>
        {% block titulo %}
        {% endblock %}
    </title>
    <link rel="stylesheet" href="{% static "css/style.css" %}" alt="usuario">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-0evHe/X+R7YkIZDRvuzKMRqM+OrBnVFBL6DOitfPri4tjfHxaWutUpFmBp4vmVor" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="icon" href="{% static 'imagenes/mapa.png' %}" type="image/jpg">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />


</head>

<body>
<div id="app">
        <nav id="navbar" class="navbar">
            <div class="menu-bar">
                <div class="menu">

                    <ul class="menu-links">

                        <li class="nav-link">
                            <a href="{% url 'mapeo:inicio' %}" class="nav__link">
                                <i class="bx bx-home-alt icon"></i>
                                <span class="text nav-text">Inicio</span>
                            </a>
                        </li>

                        <li class="nav-link">
                            <a href="{% url 'mapeo:acerda_de' %}" class="nav__link">
                                <i class="bx bx-search-alt icon"></i>
                                <span class="text nav-text">Acerca de</span>
                            </a>


                        <li>
                    </ul>
                </div>

            </div>
            <div style="height: 300%; display: flex">
                <img src="{% static 'imagenes/logoUNL.png' %}" style="height: 100%; margin-right: 20px">
                <img src="{% static 'imagenes/LogoCarrera.png' %}" style="height: 100%; margin-right: 20px">
            </div>
        </nav>

        <div class="contenido">
            {% block contenido %}
            {% endblock %}
        </div>
</div>



<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD_lvwQByfg-IacO6-U8R_83InPhayIvjI&libraries=places&callback=initMap"></script>
<script src="{% static "scripts/scripts.js" %}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm"
        crossorigin="anonymous"></script>


</body>
</html>
