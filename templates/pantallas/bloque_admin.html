{% extends 'pantallas/base_admin.html' %}
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>
        {% block titulo %}
            Bloques
        {% endblock %}
    </title>
    <link rel="stylesheet" href="{% static "css/style.css" %}" alt="usuario"
          style="padding-bottom: 35px; margin-top: 30px" width=20%>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-0evHe/X+R7YkIZDRvuzKMRqM+OrBnVFBL6DOitfPri4tjfHxaWutUpFmBp4vmVor" crossorigin="anonymous">

</head>

<body>
{% block contenido %}

    <div class="d-flex justify-content-between">

        <h1 class="container">Bloques</h1>
        <div>
            <a href="{% url 'anadir-bloque' %}">
                <button type="button" class="btn btn-dark mx-5 mt-3">Añadir</button>
            </a>
        </div>


    </div>

    <div class="container">
        <table class="table table-striped table-hover table-bordered">
            <thead class="thead_bloque">
            <tr class="table-dark">
                <th>Número</th>
                <th>Zona</th>
                <th>Código</th>
                <th>Descripción</th>
                <th>Facultad</th>
            </tr>
            </thead>


            <tbody class="tbody_bloque">
            <tr>
                <td><a href="{% url 'detalle-bloque' %}">1</a></td>
                <td><a href="{% url 'detalle-bloque' %}">Argelia</a></td>
                <td><a href="{% url 'detalle-bloque' %}">001</a></td>
                <td><a href="{% url 'detalle-bloque' %}">Redondel</a></td>
                <td><a href="{% url 'detalle-bloque' %}">N/A</a></td>
            </tr>
        </table>
    </div>

    <script src="{% static "scripts/scripts.js" %}"></script>

{% endblock %}
</body>

</html>
