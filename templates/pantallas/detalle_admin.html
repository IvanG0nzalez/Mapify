{% extends 'pantallas/base_admin.html' %}
{% load static %}

{% block titulo %}
    Detalle Administrador
{% endblock %}


{% block contenido %}
    <h1 class="container">Detalle Administrador</h1>

    <div class="container mt-5">
        <form>
            <div class="mb-3">
                <li>
                    <label for="id" class="form-label"><strong>ID:</strong> {{ admin.id }}</label>
                </li>
            </div>
            <div class="mb-3">
                <li>
                    <label for="nombres" class="form-label"><strong>Nombres:</strong> {{ admin.first_name }}</label>
                </li>
            </div>
            <div class="mb-3">
                <li>
                    <label for="apellidos" class="form-label"><strong>Apellidos:</strong> {{ admin.last_name }}
                    </label>
                </li>
            </div>
            <div class="mb-3">
                <li>
                    <label for="email" class="form-label"><strong>Email:</strong> {{ admin.email }}</label>
                </li>
            </div>
            <div class="mb-3">
                <li>
                    <label for="last_login" class="form-label"><strong>Última conexión:</strong> {{ admin.last_login }}</label>
                </li>
            </div>
            <div class="mb-3">
                <li>
                    <label for="contrassenia" class="form-label"><strong>Contraseña:</strong> {{ admin.password }}</label>
                </li>
            </div>
            <div class="d-flex justify-content-between">
                <div>
                    <a href="{% url 'mapeo:modificar-admin' admin.id %}"
                       class="btn btn-warning mx-2">Modificar</a>
                    <a href="{% url 'mapeo:eliminar-admin' admin.id %}" class="btn btn-danger mx-2">Eliminar</a>
                    <a href="{% url 'mapeo:admin' %}" class="btn btn-primary mx-2">Volver</a>
                </div>
            </div>
        </form>
    </div>
{% endblock %}
