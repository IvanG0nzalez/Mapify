{% extends 'pantallas/base_admin.html' %}

{% block titulo %}Crear administrador{% endblock %}

{% block contenido %}
    <div id="div_center">
        <div class="div_responsive mt-5">
            <div>
                <strong>Registro de administrador</strong>
            </div>
            <div>
                <form method="POST">
                    {% csrf_token %}
                    <span> {{ form.as_p }}</span>

                    <div class="d-flex justify-content-end">
                        <a href="{% url 'mapeo:admin' %}" class="btn btn-danger mx-2">Cancelar</a>
                        <button class="btn btn-dark mx-2" type="submit">Agregar</button>
                    </div>


                </form>
            </div>
        </div>
    </div>

{% endblock %}
