{% extends 'pantallas/base_admin.html' %}
{% load static %}

{% block titulo %}
    Modificar Facultad
{% endblock %}


{% block contenido %}
    <h1 class="container">Modificar Facultad</h1>

    <div id="div_center">
        <div class="container mt-5" id="modificarFacultad">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="{{ form.nombre.id_for_label }}" class="form-label">Nombre:</label>
                    <span>{{ form.nombre }}</span>
                </div>
                <div class="d-flex justify-content-start mb-3">
                    <label for="{{ form.descripcion.id_for_label }}" class="form-label">Descripción:</label>
                    <span>{{ form.descripcion }}</span>
                </div>
                <div class="mb-3">
                    <label for="{{ form.imagen.id_for_label }}" class="form-label">Imagen:</label>
                    <span>{{ form.imagen }}</span>
                </div>

                <div class="d-flex justify-content-end">
                    <a href="{% url 'mapeo:facultad' %}"
                       class="btn btn-danger mx-2">Cancelar</a>
                    <input type="submit" value="Guardar" class="btn btn-primary">
                </div>

            </form>
        </div>
    </div>
{% endblock %}
