{% load static %}
<!doctype html>
<html lang="es">
  <head>


    <title>
      {% block titulo %}
          Iniciar Sesión
      {% endblock %}
    </title>
        <link rel="stylesheet" href="{% static "css/style.css" %}" alt="usuario" style="padding-bottom: 35px; margin-top: 30px" width=20%>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-0evHe/X+R7YkIZDRvuzKMRqM+OrBnVFBL6DOitfPri4tjfHxaWutUpFmBp4vmVor" crossorigin="anonymous">

  </head>

  <body>

    <div class="barraPrincipal" style="height: 60px">
        <h1 align="center" id="texto_barra"></h1>
    </div>


        <div class="div_inicio_sesion">
            <div align="center" style="margin-top: 50px">
                <img src="{% static 'imagenes/user.png' %}" alt="usuario" style="padding-bottom: 35px; margin-top: 30px" width=20%>
                <form method="POST" action="{% url 'mapeo:login' %}">
                {% csrf_token %}
                <div class="form-group" style="width: 25%">
                    <label>Nombre de usuario</label>
                    <input type="text" class="form-control" placeholder="Nombre de usuario" name="username">
                </div>

                <div class="form-group" style="width: 25%">
                    <label>Contraseña</label>
                    <input type="password" class="form-control" placeholder="Contraseña" name="password">
                </div><br>

                <button type="submit" class="btn btn-primary">Iniciar Sesión</button>

                {% if messages %}
                    <div id="mensaje">
                        <ul class="messages">
                            {% for message in messages %}
                                <p{% if message.tags %} class="{{ message.tags }}"{% endif %} align="center">{{ message }}</p>
                            {% endfor %}
                        </ul>
                    </div>
                {% endif %}

            </form>
        </div>
    </div>
  </body>
</html>
