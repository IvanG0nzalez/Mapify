{% extends 'pantallas/base_admin.html' %}
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>
        {% block titulo %}
            Modificar Facultad
        {% endblock %}
    </title>
    <link rel="stylesheet" href="{% static "css/style.css" %}" alt="usuario"
          style="padding-bottom: 35px; margin-top: 30px" width=20%>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-0evHe/X+R7YkIZDRvuzKMRqM+OrBnVFBL6DOitfPri4tjfHxaWutUpFmBp4vmVor" crossorigin="anonymous">

</head>

{% block contenido %}
    <h1 class="container">Modificar Facultad</h1>

    <div class="container mt-5">
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="{{ form.nombre.id_for_label }}" class="form-label">Nombre:</label>
                {{ form.nombre }}
            </div>
            <div class="mb-3">
                <label for="{{ form.descripcion.id_for_label }}" class="form-label">Descripción:</label>
                {{ form.descripcion }}
            </div>
            <div class="mb-3">
                <label for="{{ form.imagen.id_for_label }}" class="form-label">Imagen:</label>
                {{ form.imagen }}
            </div>

            <div class="d-flex justify-content-end">
                <input type="submit" value="Guardar" class="btn btn-primary">
                <a href="{% url 'mapeo:facultad_id' facultad_id=facultad_id %}" class="btn btn-danger mx-2">Cancelar</a>
            </div>

        </form>
    </div>

    <script src="{% static "scripts/scripts.js" %}"></script>
{% endblock %}

</html>
