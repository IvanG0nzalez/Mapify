{% extends 'pantallas/base_admin.html' %}
{% load static %}


        {% block titulo %}
            Nodos
        {% endblock %}

{% block contenido %}

    <div class="d-flex justify-content-between">
        <h1 class="container">Nodos</h1>
    </div>

    <div class="container">
        <table class="table table-striped table-hover table-bordered">
            <thead class="thead_bloque">
            <tr class="table-dark">
                <th class="text-center">ID</th>
                <th class="text-center">Codigo</th>
                <th class="text-center">Latitud</th>
                <th class="text-center">Altitud</th>
                <!--<th class="text-center">Conexiones</th>-->
            </tr>
            </thead>
            <tbody>
            {% for nodo in nodos %}
                <tr>
                    <td class="text-center"><a href="{% url 'mapeo:nodo_id' nodo_id=nodo.id %}">{{ nodo.id }}</a></td>
                    <td class="text-center"><a href="{% url 'mapeo:nodo_id' nodo_id=nodo.id %}">{{ nodo.codigo }}</a></td>
                    <td class="text-center"><a href="{% url 'mapeo:nodo_id' nodo_id=nodo.id %}">{{ nodo.latitud }}</a></td>
                    <td class="text-center"><a href="{% url 'mapeo:nodo_id' nodo_id=nodo.id %}">{{ nodo.altitud }}</a></td>
                </tr>
            {% endfor %}
            </tbody>
        </table>
    </div>

    <script src="{% static "scripts/scripts.js" %}"></script>

{% endblock %}


</html>
